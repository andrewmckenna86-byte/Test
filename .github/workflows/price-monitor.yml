name: Price monitor

on:
  schedule:
    # Every 4 hours (UTC). Adjust as you like; GitHub may delay scheduled runs a bit.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the updated prices.json

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          CONFIG=config.yaml
          [ -f "$CONFIG" ] || CONFIG=config.example.yaml
          python price_monitor.py --config "$CONFIG" --state prices.json

      - name: Save price history
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update price history [skip ci]"
          git push
